run:
  seed: 42

model:
  block_size: 2048

train:
  batch_size: 2

prune:
  base_model: Qwen/Qwen2.5-0.5B
  output_dir: runs/pruned-qwen25-0p5b
  method: magnitude
  sparsity: 0.5
  sparsity_denominator: prunable
  granularity: layer
  include_lm_head: false
  calibration_data_path: /path/to/calibration_or_sft.json
  calibration_batches: 128
  max_length: 256
  batch_size: 2
  num_workers: 0
  recovery_steps: 0
  recovery_learning_rate: 0.000005
  recovery_weight_decay: 0.0
  max_grad_norm: 1.0
  overwrite: true
