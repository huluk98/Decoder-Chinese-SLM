model_name_or_path: /path/to/model
train_file: data/scenic/SCENIC_full_training_dataset.json
eval_file: data/scenic/SCENIC_full_training_dataset.json
benchmark_file: data/benchmarks/iot_instruction_benchmark_200.json
output_dir: outputs/sft_0p2b_8gpu

max_seq_length: 128
max_new_tokens: 64
benchmark_runs: 5
top_k_exact_match: 5

num_train_epochs: 3
learning_rate: 2.0e-5
warmup_ratio: 0.03
weight_decay: 0.01
lr_scheduler_type: cosine
max_grad_norm: 1.0

bf16: true
fp16: false
tf32: true

per_device_train_batch_size: 16
per_device_eval_batch_size: 16
gradient_accumulation_steps: 1

gradient_checkpointing: false
attn_implementation: sdpa
flash_attention: false
sdp_flash: true
torch_compile: false

logging_steps: 10
save_strategy: epoch
eval_strategy: none
save_final_only: true
save_total_limit: 1

dataloader_num_workers: 8
dataloader_pin_memory: true
persistent_workers: true
group_by_length: true
remove_unused_columns: false

generation:
  max_new_tokens: 64
  do_sample: false
  num_beams: 1
