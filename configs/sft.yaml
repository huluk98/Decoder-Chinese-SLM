run:
  seed: 42
  output_dir: runs/sft-0p2b

model:
  block_size: 2048
  gradient_checkpointing: true

sft:
  mode: sft
  base_model: runs/h20-8gpu-llama-0p2b-deepspeed/latest
  data_path: data/sft/train.jsonl
  max_length: 2048
  max_samples: null

train:
  batch_size: 4
  grad_accum_steps: 8
  max_steps: 2000
  learning_rate: 0.00002
  min_learning_rate: 0.000002
  warmup_steps: 100
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0
  precision: bf16
  tf32: true
  num_workers: 2
  log_every: 10
  save_every: 500
  save_total_limit: 1
  save_final_only: true
