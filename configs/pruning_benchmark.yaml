benchmark:
  output_dir: runs/pruning-benchmark-0p2b
  base_checkpoint: runs/contrastive-sft-0p2b-8gpu/latest
  prune_config: configs/prune_50.yaml
  methods: [magnitude, 2of4, wanda, gradient]
  eval_file: /path/to/eval.json
  run_dense_baseline: true
  min_dense_exact_match_accuracy: 0.01
  benchmark_runs: 1
  max_new_tokens: 64
  max_length: 128
  eval_batch_size: 16
  dtype: bf16
  nproc_per_node: 8
  expected_gpu_count: 8
  cuda_visible_devices: 0,1,2,3,4,5,6,7
  sparsity_tolerance: 0.000001
  continue_on_error: true

prune:
  sparsity: 0.5
  # whole_model targets real checkpoint-level sparsity while keeping protected
  # embeddings, lm_head, norms, biases, and non-Linear parameters unchanged.
  # Pure NVIDIA 2:4 remains a fixed 50% prunable-weight structural method; the
  # pruning script reports that method as vanilla 2:4 instead of pretending it
  # can also hit a 50% whole-model target.
  sparsity_denominator: whole_model
  include_lm_head: false
  calibration_data_path: /path/to/calibration_or_sft.jsonl
  calibration_batches: 128
  max_length: 128
  batch_size: 2
  num_workers: 0

one_shot:
  enabled: true

retune:
  enabled: true
  config: configs/sft_0p2b_8gpu.yaml
  mode: sft
  data_path: /path/to/retune_sft.jsonl
  max_steps: null
  epochs: 3
  per_device_train_batch_size: null
  gradient_accumulation_steps: null
  max_seq_length: 128
  keep_pruning_masks: true
