benchmark:
  output_dir: runs/pruning-benchmark-contrastive-sft-0p2b
  base_checkpoint: runs/contrastive-sft-0p2b-8gpu/final
  prune_config: configs/prune_50.yaml
  methods: [magnitude, 2of4, wanda, gradient]
  eval_files:
    anchor_dataset: "/Users/luke/Documents/SCENIC agent/data/SCENIC_full_training_dataset.json"
    benchmark: data/benchmarks/iot_instruction_benchmark_200.json
  run_dense_baseline: true
  min_dense_exact_match_accuracy: null
  benchmark_runs: 1
  top_k_exact_match: 5
  comparison_mode: whitespace
  max_new_tokens: 64
  max_length: 128
  eval_batch_size: 16
  dtype: bf16
  nproc_per_node: 8
  expected_gpu_count: 8
  cuda_visible_devices: 0,1,2,3,4,5,6,7
  sparsity_tolerance: 0.000001
  continue_on_error: true

prune:
  sparsity: 0.5
  scope: full_model
  sparsity_denominator: whole_model
  granularity: global
  include_lm_head: true
  calibration_data_path: "/Users/luke/Documents/SCENIC agent/data/SCENIC_full_training_dataset.json"
  calibration_batches: 128
  max_length: 128
  batch_size: 2
  num_workers: 0

one_shot:
  enabled: true

retune:
  enabled: true
  config: configs/contrastive_sft_8gpu.yaml
  mode: contrastive
  data_path: "/Users/luke/Documents/SCENIC agent/data/SCENIC_full_anchor_positive_negative.json"
  max_steps: null
  epochs: 3
  per_device_train_batch_size: null
  gradient_accumulation_steps: null
  max_seq_length: 128
  keep_pruning_masks: true
