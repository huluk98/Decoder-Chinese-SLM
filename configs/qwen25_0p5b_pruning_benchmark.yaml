benchmark:
  output_dir: runs/qwen25-0p5b-pruning-benchmark
  base_checkpoint: Qwen/Qwen2.5-0.5B
  prune_config: configs/prune_qwen25_0p5b_50.yaml
  methods: [magnitude, 2of4, wanda, gradient]
  eval_file: /path/to/eval.json
  run_dense_baseline: true
  min_dense_exact_match_accuracy: 0.01
  benchmark_runs: 1
  max_new_tokens: 64
  max_length: 256
  eval_batch_size: 16
  dtype: bf16
  nproc_per_node: 8
  expected_gpu_count: 8
  cuda_visible_devices: 0,1,2,3,4,5,6,7
  sparsity_tolerance: 0.000001
  continue_on_error: true

prune:
  sparsity: 0.5
  sparsity_denominator: prunable
  granularity: layer
  include_lm_head: false
  calibration_data_path: /path/to/calibration_or_sft.json
  calibration_batches: 128
  max_length: 256
  batch_size: 2
  num_workers: 0

one_shot:
  enabled: true

retune:
  enabled: true
  config: configs/sft_0p2b_8gpu.yaml
  mode: sft
  data_path: /path/to/retune_sft.json
  max_steps: null
  epochs: 3
  per_device_train_batch_size: null
  gradient_accumulation_steps: null
  max_seq_length: 256
  keep_pruning_masks: true
