run:
  seed: 42
  output_dir: runs/contrastive-sft-0p2b

model:
  block_size: 2048
  gradient_checkpointing: true

sft:
  mode: contrastive
  base_model: runs/sft-0p2b/latest
  data_path: data/sft/contrastive_train.jsonl
  max_length: 2048
  alignment_weight: 0.1
  margin: 0.5
  max_samples: null

train:
  batch_size: 2
  grad_accum_steps: 8
  max_steps: 1000
  learning_rate: 0.00001
  min_learning_rate: 0.000001
  warmup_steps: 50
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0
  precision: bf16
  tf32: true
  num_workers: 2
  log_every: 10
  save_every: 250
  save_total_limit: 3
