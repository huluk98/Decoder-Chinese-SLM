run:
  seed: 42

model:
  block_size: 2048

train:
  batch_size: 2

prune:
  base_model: runs/contrastive-sft-0p2b/latest
  output_dir: runs/pruned-0p2b
  method: magnitude
  sparsity: 0.5
  # ED-comparable target accounting: prune 50% of the targeted Linear weights,
  # not 50% of all model parameters. Embeddings, lm_head/output heads, norms,
  # biases, and non-Linear tensors stay dense, so whole-model sparsity is lower.
  # Exact NVIDIA 2:4 is a separate fixed-pattern condition and is also reported
  # as 50% prunable Linear sparsity because protected parameters cannot be pruned.
  scope: transformer_linears
  sparsity_denominator: prunable
  granularity: global
  include_lm_head: false
  calibration_data_path: data/sft/contrastive_train.jsonl
  calibration_batches: 64
  max_length: 256
  batch_size: 2
  num_workers: 0
  recovery_steps: 0
  recovery_learning_rate: 0.000005
  recovery_weight_decay: 0.0
  max_grad_norm: 1.0
  overwrite: true
