run:
  seed: 42

model:
  block_size: 2048

train:
  batch_size: 2

prune:
  base_model: runs/contrastive-sft-0p2b/latest
  output_dir: runs/pruned-0p2b
  method: magnitude
  sparsity: 0.5
  # Full-model pruning: no embeddings, heads, norms, or biases are protected.
  # Magnitude/gradient are global over all floating parameters; WANDA uses
  # activation scores for Linear weights and magnitude fallback elsewhere.
  # 2:4 keeps exact 2:4 on eligible Linear weights and magnitude-prunes the rest.
  scope: full_model
  sparsity_denominator: whole_model
  granularity: global
  include_lm_head: true
  calibration_data_path: data/sft/contrastive_train.jsonl
  calibration_batches: 128
  max_length: 2048
  batch_size: 2
  num_workers: 0
  recovery_steps: 0
  recovery_learning_rate: 0.000005
  recovery_weight_decay: 0.0
  max_grad_norm: 1.0
  overwrite: true
