[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatlm-decoder"
version = "0.1.0"
description = "Decoder-only Chinese mini language model training skeleton"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2,<3",
  "transformers==4.48.3",
  "datasets>=2.19",
  "huggingface_hub>=0.24",
  "tokenizers>=0.21,<0.22",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "numpy>=1.26,<3",
  "accelerate>=1.0,<2",
  "onnx>=1.16",
  "onnxruntime>=1.18; platform_system != 'Linux'",
  "safetensors>=0.4.5",
  "sentencepiece>=0.2",
  "hf-transfer>=0.1.8",
  "hf-xet>=1.1.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
h20 = [
  "onnxruntime-gpu>=1.18; platform_system == 'Linux'",
  "deepspeed>=0.14.5; platform_system == 'Linux'",
]
deepspeed = [
  "deepspeed>=0.14.5; platform_system == 'Linux'",
]
trt = [
  "onnx>=1.16",
  "onnxruntime-gpu>=1.18; platform_system == 'Linux'",
  "cuda-python>=12.2",
  "tensorrt>=10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
